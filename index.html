<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Học Tiếng Anh</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 id="page-title" class="app-title">Chương Trình Ôn Học</h1>
      <p id="page-subtitle" class="app-subtitle">Chọn môn học để bắt đầu luyện tập</p>
    </header>

    <!-- Main Stage: Nơi hiển thị danh sách môn học HOẶC bài học -->
    <main id="app-stage" class="course-list">
      
      <!-- Nút chọn môn học 1 -->
      <button class="course-card" data-course-id="public-speaking">
        <div class="course-icon">🎤</div>
        <div class="course-info">
          <h2 class="course-title">Foundation of Public Speaking</h2>
          <p class="course-desc">Rèn luyện kỹ năng thuyết trình & tự tin nói trước đám đông</p>
        </div>
        <div class="course-arrow">➔</div>
      </button>

      <!-- Nút chọn môn học 2 -->
      <button class="course-card" data-course-id="reading-2">
        <div class="course-icon">📖</div>
        <div class="course-info">
          <h2 class="course-title">Foundation to Reading 2</h2>
          <p class="course-desc">Củng cố đọc hiểu, từ vựng & cấu trúc ngữ pháp nền tảng</p>
        </div>
        <div class="course-arrow">➔</div>
      </button>

      <!-- Nút chọn môn học 3 -->
      <button class="course-card" data-course-id="listening-speaking-2">
        <div class="course-icon">🎧</div>
        <div class="course-info">
          <h2 class="course-title">Listening and Speaking 2</h2>
          <p class="course-desc">Nâng cao phản xạ nghe nói & phát âm giao tiếp</p>
        </div>
        <div class="course-arrow">➔</div>
      </button>

    </main>
  </div>

  <!-- Nạp file JavaScript chính -->
  <script src="js/app.js" type="module"></script>
</body>
</html>
